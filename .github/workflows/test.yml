name: test

# Every branch, deliberately. Work on this project happens on long-lived
# branches and forks as well as main, and listing them here would bake one
# repository's layout into a file that is meant to stay identical wherever
# it is merged. The concurrency group below keeps a busy branch to a single
# run at a time.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: server

      # Local replacements use these sibling directories. Pin their complete
      # source revisions so one Server commit selects one reproducible graph.
      # Bump the refs together after compiling the service commands. Connect's
      # tracked sctp/ directory supplies the SCTP fork from the same revision.
      - uses: actions/checkout@v4
        with: { repository: urnetwork/connect, path: connect, ref: 5e9a5fc4e17814608e6c420563aa09f153bc7d86 }
      - uses: actions/checkout@v4
        with: { repository: urnetwork/glog, path: glog, ref: 80a11b434ae90ae2221deb932daa21913919875a }
      - uses: actions/checkout@v4
        with: { repository: urnetwork/sdk, path: sdk, ref: 8d8ecc4d84763de09f0a69c355b3a65e79d38126 }
      - uses: actions/checkout@v4
        with: { repository: urnetwork/proxy, path: proxy, ref: e1da814937132eeca361bcd5defc12cde7e793cf }
      - uses: actions/checkout@v4
        with: { repository: urnetwork/goidenticons, path: goidenticons, ref: 06eb779a691e056be7dc5fa9a0239001c3ea390f }
      - uses: actions/checkout@v4
        with: { repository: urnetwork/userwireguard, path: userwireguard, ref: 85fb1ca4086fa5dbfcda526bec7a17a894e691b9 }
      - uses: actions/checkout@v4
        with: { repository: urnetwork/operator-proxy, path: operator-proxy, ref: 4c77a9ddf169f36d0c2ec14c4feed90782dffd83 }
      - uses: actions/checkout@v4
        with: { repository: urnetwork/warp, path: warp, ref: 3b6e875f83140b2de1a50d2bfffe0f7830edd74e }
      - uses: actions/checkout@v4
        with: { repository: urfoundation/sn, path: sn, ref: a70dae9c367868073f7325a16b34bd885f59b943 }
      # Server pins this fork in go.mod. Its test generator also builds SN as
      # a main module, where the local gvisor replacement still applies.
      - uses: actions/checkout@v4
        with: { repository: urnetwork/gvisor, path: gvisor, ref: c0783dba2eeff7b79692a7f122ffee5f8bd837c1 }

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: go build ./...

      # Build populates the checksum-verified module cache first. The source
      # gate then resolves the graph without permitting download fallback.
      - name: Verify service source graph
        working-directory: server
        run: go test ./local/source-graph -count=1

      - name: Vet
        working-directory: server
        run: go vet ./...

      # Compiles every test binary without running any of them. The suite
      # proper needs postgres and redis (see server.DefaultTestEnv), which
      # this job deliberately does not stand up -- but a test file that no
      # longer compiles is a break worth catching on every PR, and it is the
      # failure that actually happens when a model signature changes.
      - name: Compile tests
        working-directory: server
        run: |
          set -euo pipefail
          # The immutable sim-latency baseline contains archived standalone
          # *_test.go reference sources which deliberately are not packages in
          # the current server module. Verify that archive through its signed
          # manifest, then compile every executable package exactly as the
          # release gate does.
          ./connect/sim-latency/baseline/verify.sh
          package_list="$(go list ./... | grep -v '^github\.com/urnetwork/server/connect/sim-latency/baseline/')"
          [[ -n "$package_list" ]]
          mapfile -t packages <<<"$package_list"
          go test -run 'XXX_NO_SUCH_TEST' -count=1 "${packages[@]}"

# The funder: a SPENDING zecd that receives Zebra's regtest coinbase at its
# transparent address, shields it, and pays the wallet under test. Test-only
# keys (a mnemonic generated by up.sh into .state/secrets).
network = "regtest"
default_wallet = "default"

[backend]
# Zebra's RPC in the compose network. zecd's default "zebra" would mean
# 127.0.0.1:18234, and its own RPC defaults to 18232 like Zebra's: both are
# set explicitly.
server = "zebra://zebrad:18232"
connect_timeout_secs = 10

[rpc]
bind = "0.0.0.0"
port = 18252
user = "funder"
password_file = "/secrets/zecd-funder.rpc-password"
# one transaction may pay the same shielded address twice (the harness checks
# that the client sums such outputs)
allow_duplicate_shielded_recipients = true

[keys]
auto_unlock = true

[pools]
enabled = ["orchard", "sapling"]
default_receivers = ["orchard"]
transparent = true

[sync]
interval_secs = 2

[spend]
# zecd's regtest harness: the funder spends what it mined after one block
trusted_confirmations = 1
untrusted_confirmations = 1
# the funder shields coinbase (transparent senders) and pays Sapling and
# Orchard receivers
privacy_policy = "AllowFullyTransparent"

[log]
level = "info"
format = "text"

  evaluation_cpu_count: 10
  management_cpu_count: 2
  memory_gib: 128

season:
  epoch_count: 6
  submission_window_seconds: 604800
  reveal: after_close_drain_and_honesty_review_finalization
  grading: immediate_redis_fifo_with_post_close_drain
  worker_lifecycle: one_shot_exit_after_epoch_drain_before_honesty_review
  next_epoch_control: external_agentic_review_and_promotion_loop
  preparation_window_seconds: 57600
  submission_fee_usd: 20
  queue_limit: 0
  score_timeout_seconds: 10800
  first_opens_at: null
  season_ends_at: null
  retain_until: null
  baseline_source_policy: promote_significant_winner_or_carry_forward_unchanged

significance:
  authority: config/main/sim-latency.yml
  method: one-sided-welch-t
  alpha: 0.05
  initial_improvement_percent: 16.1
  threshold_scope: per_source_epoch
  evaluation_record: means_variances_p_value_and_next_epoch_recommendation
  winner_requirement: placeable_margin_statistical_significance_and_approved_honesty_review
  no_winner_policy: carry_commits_and_threshold_forward_when_none_significant_or_all_rejected

honesty_review:
  authority: postgres_append_only_competition_candidate_review
  command: sim-latency epoch-review
  environment: main
  ordering: normalized_score_desc_raw_score_asc_submitted_at_job_id
  candidate_materialization: fresh_mode_0700_temp_dir_with_mode_0400_patch_score_and_metadata
  evidence: bounded_json_object_with_sha256_reviewer_reason_and_timestamp
  reject_behavior: advance_to_next_ranked_significant_candidate
  approve_behavior: atomically_finalize_exact_candidate_as_winner
  exhaustion_behavior: atomically_finalize_without_winner
  public_before_finalization: false

evaluation_source:
  manifest: config/main/sim-latency.yml
  authoritative_fields: branch_epoch_commits_and_significant_improvement_percent
  repositories:
    - server
    - connect
    - sdk
    - proxy
    - glog
    - goidenticons
    - userwireguard
    - sn
  canonical_patch_repository: server
  round_source_epoch_offset: -1
  promotion_command: sim-latency promote
  activation_order: repository_branches_then_config_ledger
  promotion_review_gate: finalized_exact_approved_job_patch_sha256_and_full_score_document
  unevaluated_repository_patches: rejected
  protected_evaluator_tree: connect/sim-latency/**
  protected_evaluator_tree_policy: hard_reject_and_verify_git_tree_unchanged


# Security updates still install. Restart these competition-owned services only
# at an idle maintenance boundary; never restart an in-flight evaluation/build.
# Merge into needrestart's existing policy rather than replacing other rules.
$nrconf{override_rc}->{qr(^urnetwork-competition-.*\.service$)} = 0;
$nrconf{override_rc}->{qr(^urnetwork-subeval-.*\.service$)} = 0;
$nrconf{override_rc}->{qr(^urnetwork-private-(?:engine(?:-network(?:-namespace)?)?|containerd)\.service$)} = 0;
$nrconf{override_rc}->{qr(^competition-.*\.service$)} = 0;
1;

stream {
    ##
    # Basic Settings
    ##

    proxy_timeout 15m;
    proxy_connect_timeout 15s;

    upstream stream-service-block-connect-443 {
        least_conn;
        server warpservices:7007 weight=1 max_fails=0 max_conns=32768;
        server warpservices:7010 weight=3 max_fails=0 max_conns=32768;
    }
    upstream stream-service-block-connect-4053 {
        least_conn;
        server warpservices:7008 weight=1 max_fails=0 max_conns=32768;
        server warpservices:7011 weight=3 max_fails=0 max_conns=32768;
    }
    server {
        # UDP upstreams require the binary address family
        # and port fields carried by PROXY protocol v2.
        # Keep the UDP pseudo-session shorter than the
        # connect server's PP address-state lifetime.
        listen 443 udp reuseport;
        listen [::]:443 udp reuseport;
        proxy_protocol v2;
        proxy_timeout 30s;
        # QUIC exchanges an unbounded number of datagrams
        # in both directions during one pseudo-session.
        proxy_requests 0;
        proxy_pass stream-service-block-connect-443;
    }
    server {
        # UDP upstreams require the binary address family
        # and port fields carried by PROXY protocol v2.
        # Keep the UDP pseudo-session shorter than the
        # connect server's PP address-state lifetime.
        listen 4053 udp reuseport;
        listen [::]:4053 udp reuseport;
        proxy_protocol v2;
        proxy_timeout 30s;
        # QUIC exchanges an unbounded number of datagrams
        # in both directions during one pseudo-session.
        proxy_requests 0;
        proxy_pass stream-service-block-connect-4053;
    }
}
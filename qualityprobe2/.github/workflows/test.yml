name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: operator-proxy

      # This module resolves its urnetwork dependencies through `replace ../`
      # directives, so a lone checkout does not build -- it fails with a
      # "missing go.sum entry" that names nothing about the real cause. The
      # siblings must sit next to it, under exactly these directory names.
      #
      # They are PINNED. Tracking connect main unpinned makes this repo's CI a
      # function of another repo's latest commit: connect raising a dependency
      # rewrites go.mod/go.sum here, which fails the tidy check below AND the
      # build ("missing go.sum entry"), so every open PR goes red at once for a
      # change none of them made. Bump these deliberately, in a commit that
      # also carries the resulting go.mod/go.sum.
      - uses: actions/checkout@v4
        with:
          repository: urnetwork/connect
          ref: 9ac9a96c96f5e3c2d7fd6e928b28b471567d0a54
          path: connect
      - uses: actions/checkout@v4
        with:
          repository: urnetwork/glog
          ref: 2bdcce5f8be023947f26a247eb5665c56b69b2e3
          path: glog

      - name: Verify pinned sibling revisions
        run: |
          test "$(git -C connect rev-parse HEAD)" = "9ac9a96c96f5e3c2d7fd6e928b28b471567d0a54"
          test "$(git -C glog rev-parse HEAD)" = "2bdcce5f8be023947f26a247eb5665c56b69b2e3"

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator-proxy/go.mod
          cache-dependency-path: operator-proxy/go.sum

      # The pinned dependency versions must actually build against the
      # connect main this cloned. A stale go.sum here is the failure mode
      # that hid until someone cloned the repo fresh.
      - name: Verify go.mod and go.sum are current
        working-directory: operator-proxy
        run: go mod tidy -diff

      - name: Build
        working-directory: operator-proxy
        run: go build ./...

      - name: Vet
        working-directory: operator-proxy
        run: go vet ./...

      - name: Check formatting
        working-directory: operator-proxy
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # -count=1 defeats the result cache, so a green run means the tests
      # really ran. -race matters here specifically: this repo's scheduler,
      # bandwidth streams and tunnel pump are all concurrent, and the
      # providertunnel handshake tests only exercise real chain verification
      # on Linux (they inject their test CA via SSL_CERT_FILE, which
      # crypto/x509 honors on Linux only), so this job is the one place those
      # run at all.
      - name: Test
        working-directory: operator-proxy
        run: go test -race -count=1 -timeout 20m ./...

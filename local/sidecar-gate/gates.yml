# §23.8's gate sweeps (TEST-M1-11; OPS-M1-07's tool): generated by sidecar's sidecartest/fault.GateFile from
# sidecartest/fault/catalog.yml, the one source for which FS rows and cases each gate shows (C-18), and from each
# gate's sweep in sidecartest/fault/gate*.go. Do not edit it: server's TestGatesYmlIsTheCatalogsGateMap fails when
# it differs, and SIDECAR_REGENERATE_GATES=1 go test ./local/sidecar-gate -run '^TestGatesYmlIsTheCatalogsGateMap$'
# writes it.
#
# Gates: G0; Mn-in, milestone n's entry review; Mn, its exit review (Mn-out); every, each Gn-out (FS-55); next,
# before place_new names a new metadata cluster. A row is an FS row's case, or an item: repo and package name
# each test, names are the tests, each of which must report PASS, so a test that does not exist reads missing,
# never pass; tags, a build tag; stores: true runs it through the private-store wrapper SIDECAR_GATE_STORE_WRAPPER
# names; args go after the package, {base} and {group} filled from the run; commands run in a repo's directory
# and pass on exit 0. A row with nothing to run is missing. external says what outside the build (hardware,
# production, people) the row also waits on, or the later gate a later-of case passes at, and reads open.
# A case's T2 test is TestFs<n><Case> in sidecar's sidecartest/fault and its T3 test TestFs<n><Case>OnT3 in
# server's sidecart3, by convention, so this file does not change as rows land.
gates:
  G0: []
  M0-in: []
  M0: []
  M1-in:
    - item: '§23.6''s M1 design closure: typed signing; transport-token states; the keystore result; HTTP liveness; persistent taint and bridge anchor (§5, §6, §7, §18); Q-CORE-4, Q-TEST-6'
      external: 'people: the Gn-in review reads and signs the closure (§23.8)'
  M1:
    - row: FS-54
      tests:
        - {repo: server, package: ., names: [TestSidecarPendingBuildTags, TestReleaseBuildRegistersNoPendingGroup]}
        - {repo: server, package: ., tags: sidecar_pending, stores: true, names: [TestSidecarGroupsEndTheMigrations, TestSidecarGroupsAreAdditive, TestSidecarGroupsApplyOnAPrivateDatabase]}
        - {repo: server, package: ./local/sidecar-migrations, names: [TestPromoteMovesOnlyItsOwnGroup, TestPromoteRefusesOutOfOrder, TestPromoteResultCompilesOnBothLegs]}
    - item: stage 1 and D-TEAM-14 enforced (§23.4's M1 exit; TEAM-M1-01)
      tests:
        - {repo: server, package: ./api, names: [TestClientAdminRefusalIsEnforcedWhateverTheConfigSays, TestEmbedRefusalIsNotCountedAsStageOne, TestStrictExpTokenIsRefusedOnEveryPaymentRoute, TestStrictExpGateRefusesWhateverTheConfigSays]}
        - {repo: server, package: ./api, stores: true, names: [TestSidecarTokenRoutes, TestMarkedClientTokensAreRefusedOnEveryAdminRoute, TestClientWhoseMarksCannotBeReadIsRefusedOnEveryAdminRoute, TestApiRefusesAnExpiredStrictExpToken]}
      external: 'production: stage 1 enforced there after its 14 log-only days (D-PHASE-3), which no local run shows'
    - item: Required RPC after §6.4's M1 identity check (§23.4's M1 exit; PROTO-M1-11)
      tests:
        - {repo: sidecar, package: ./sidecartest, names: [TestSubprotocolRequiredRpcAfterTheIdentityCheck, TestSubprotocolNothingBeforeAVerifiedHello, TestSubprotocolNoSessionIsUnavailableEncryption, TestSubprotocolControlContractCarriesNoData]}
        - {repo: server, package: ./connect, stores: true, names: [TestSidecarSubprotocolT3HelloHeadCheckAndClosedData]}
    - item: push resyncs after a resident restart (§23.4's M1 exit; PROTO-M1-11)
      tests:
        - {repo: sidecar, package: ./sidecartest, names: [TestPushResyncsAfterAResidentRestart, TestPushPartialResetAppliesNothingUntilVersionsRefetched]}
        - {repo: server, package: ./connect, stores: true, names: [TestSidecarPushFromARealResidentKeptByTheDispatcher]}
    - item: envelope fuzzed (§23.4's M1 exit), its seeds running as tests through §22.6's registry (TEST-M1-10)
      tests:
        - {repo: sidecar, package: ., names: [FuzzEnvelope, FuzzChunkReassembly, FuzzProtocolBody]}
        - {repo: sidecar, package: ./protocol, names: [FuzzBody]}
        - {repo: sidecar, package: ./check, tags: sidecar_check, names: [TestFuzzRegistry, TestFuzzSeedsRunUnderTestSh]}
    - item: daemon on darwin, linux and windows, in preview_networks only (§23.4's M1 exit; D-TRUST-3; CORE-M1-13)
      tests:
        - {repo: sidecar, package: ., names: [TestCoreM1GateRowsHaveTheirTests, TestCoreM1GateEnrollsAndRefreshesEndToEnd, TestOtherUidRefused, TestPreviewRefusalSurfaces]}
        - {repo: server, package: ./model, names: [TestSidecarPreviewAllowedOnlyForAListedNetwork, TestSidecarPreviewRefusesWhenTheFileCannotBeRead]}
      external: 'hardware and production: the daemon''s hand runs on linux and windows hosts, since this host runs darwin and the legs runner only compiles windows, and preview_networks in production''s config/<env>/sidecar.yml'
    - item: typed signing (§23.6's M1 closure; PROTO-M1-01)
      tests:
        - {repo: sidecar, package: ./protocol/bridge, names: [TestVerifySignedRefusesEveryOtherType, TestVerifySignedRefusesRewrittenType, TestVerifySignedChecksTypeBeforeSignature, TestVerifySignedCoversReceivedBytesNeverAReMarshal, FuzzSignedTypeConfusion]}
    - item: the keystore result (§23.6's M1 closure; D-CORE-15; CORE-M1-02)
      tests:
        - {repo: sidecar, package: ., names: [TestAbsentWithNothingRecordedCreatesU, TestAbsentWithRecordedIdCreatesNothing, TestLockedCreatesNothing, TestFailedCreatesNothing, TestCorruptBytesAreFailed, TestLostKeychainWrapIsKeystoreLost]}
    - item: 'Q-TEST-6''s descriptor lint: no oneof from the envelope, stream and push roots (§23.6''s M1 closure)'
      tests:
        - {repo: sidecar, package: ./protocol, names: [TestNoOneofFromEnvelopeStreamAndPushRoots, TestOneofLintCatchesPlantedDeclarations, TestNoOneofInWhatStreamsAndPushesCarry]}
    - item: make check's rules over this tree (§4.7), beside test.sh's module phases, which run first in its gate cadence
      tests:
        - {repo: sidecar, package: ./check, tags: sidecar_check, names: [TestDeps, TestLayering, TestLegs, TestCgo, TestHygiene, TestEveryRowHasARuleAndAPlantedViolation]}
    - item: §22.4's release fixture, from the consumer wiring (build's sidecar release step)
      tests:
        - {repo: build, dir: all, package: ., tags: sidecar_release_fixture, names: [TestSidecarReleaseFixture]}

# §23.6's schedules by gate (OPS-M1-07), which server/local/sidecar-gate runs and reports.
# Each FS row §23.6 names at a gate is here, and TestGatesListEverySection236Row re-reads the
# table from design/source/sections/23-PHASE.md, so this list cannot drift from it. When
# sidecartest/fault/catalog.yml lands (TEST-M0-01), this file is generated from it instead (C-18).
#
# A row lists the tests that show it, each a direct go test on one package: repo and package
# name where; names are the tests, each of which must report PASS, so a test that does not
# exist reads missing, never pass; tags, a build tag; stores: true runs it through the private-store
# wrapper named by SIDECAR_GATE_STORE_WRAPPER; args go after the package, {base} and {group}
# filled from the run. A row with no tests is missing. external says what outside the build
# (hardware, production, people) the row waits on, and reads open. Rows other plans own carry
# no tests until those plans name them.
gates:
  G0: []
  M0: []
  M1:
    - row: FS-54
      case: release leg
      tests:
        - {repo: server, package: ".", names: [TestSidecarPendingBuildTags, TestReleaseBuildRegistersNoPendingGroup]}
    - row: FS-54
      case: tagged build
      tests:
        - {repo: server, package: ".", tags: sidecar_pending, stores: true, names: [TestSidecarGroupsEndTheMigrations, TestSidecarGroupsAreAdditive, TestSidecarGroupsApplyOnAPrivateDatabase]}
    - row: FS-54
      case: promotion
      tests:
        - {repo: server, package: ./local/sidecar-migrations, names: [TestPromoteMovesOnlyItsOwnGroup, TestPromoteRefusesOutOfOrder, TestPromoteResultCompilesOnBothLegs]}

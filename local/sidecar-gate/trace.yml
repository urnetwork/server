# The design trace (TEST-M1-12; R-ARCH-1, D-CTX-2, D-TRUST-2, D-ARCH-2): each roll-up row of §1.2, §2.2, §2.9,
# §3.2, §23.2 and the X list, with its first gate and what shows it, which `go run ./local/sidecar-gate trace`
# reads against the design's own tables. A row the design gains fails the run until it is listed here, and an
# id listed here that no table holds fails too.
#
# rows       one per roll-up id, in the design's order
#   gate     its first gate: G0, Mn (milestone n's exit) or Mn-in, from its owning sections' milestones (§23.4)
#   task     the task whose evidence shows it, for a reader
#   tests    go tests on packages, as gates.yml writes them; each must pass
#   schedules  FS rows, "FS-n" or "FS-n (case)", run as gates.yml's row for them at their first gate
#   commands   checks run in a repo's directory; one printing "sidecar-gate outcome: <outcome>" reads that
#   gates    whole gates of gates.yml
#   open     what outside the build it waits on: hardware, production or people; it reads open, never pass
#   out_of_build  §1.7's words, for a row whose work is out of this build (D-CTX-1); it reads open
#   A row naming nothing reads missing, and so does one naming a test that does not exist.
# carriers   carriers §3.5's table does not hold that the sidecar blocks or the sidecar may use, each citing
#            the owner decision that allows it (D-ARCH-2); one citing none allows nothing
#
# The evidence is a first cut, from each row's owning sections and the schedules §23.6 puts at its first gate;
# rows with no evidence yet read missing until a task names what shows them.


# The lb in front of evs, as warp generates it, for sidecart3's disruption rows (TEST-M2-15; §22.8's lb drain).
# sidecart3/disruption.go renders this with Go's text/template and runs nginx on it; README.md says where each line
# comes from and how TestLbFixtureKeepsWarpsDirectives holds it to warp/warpctl/config.go.
#
#   .Directory   the run's scratch directory: nginx's prefix, its pid, logs and temp files
#   .ListenPort  the loopback port clients dial
#   .Upstreams   each evs block's loopback address, as warp lists a service's blocks in its upstream
worker_processes 1;
pid {{.Directory}}/nginx.pid;
error_log {{.Directory}}/error.log info;

events {
    worker_connections 256;
}

http {
    access_log {{.Directory}}/access.log;
    client_body_temp_path {{.Directory}}/client_body;
    proxy_temp_path {{.Directory}}/proxy;
    fastcgi_temp_path {{.Directory}}/fastcgi;
    uwsgi_temp_path {{.Directory}}/uwsgi;
    scgi_temp_path {{.Directory}}/scgi;

    # warp/warpctl/config.go's http settings (NginxConfig's "Http Settings"), every lb block's
    keepalive_timeout 1m;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 8k;
    client_body_buffer_size 64k;
    client_max_body_size 16m;
    proxy_buffering off;
    proxy_request_buffering on;
    client_header_timeout 15s;
    client_body_timeout 15s;
    proxy_http_version 1.1;
    proxy_socket_keepalive on;
    proxy_next_upstream error timeout http_503 non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 30s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    send_timeout 30s;

    # a service's upstream (config.go's service-block upstreams) with services.DefaultKeepalive's pool
    upstream service-block-evs {
{{- range .Upstreams}}
        server {{.}} weight=1 max_fails=0 max_conns=32768;
{{- end}}
        keepalive 1024;
        keepalive_requests 8192;
        keepalive_time 15m;
        keepalive_timeout 1m;
    }

    server {
        listen 127.0.0.1:{{.ListenPort}};

        # evs's own host: every path buffers and is retry-covered, but streamable_paths
        # (warp/services/sidecar-blocks/evs.yml), whose body streams (addStreamablePathsLocation, addStreamableProxy)
        location / {
            proxy_set_header Connection 'keep-alive';
            proxy_set_header X-UR-Forwarded-For $remote_addr:$remote_port;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Source-Port "";
            proxy_set_header Host $host;
            proxy_set_header X-UR-Request-Buffering "";
            proxy_pass http://service-block-evs;

            location ~ "^(?:(?:/evs/v1/repos/[^/]+/segments/[^/]+))$" {
                proxy_pass http://service-block-evs;
                proxy_set_header Connection 'keep-alive';
                proxy_set_header X-UR-Forwarded-For $remote_addr:$remote_port;
                proxy_set_header X-Forwarded-For "";
                proxy_set_header X-Forwarded-Source-Port "";
                proxy_set_header Host $host;
                proxy_set_header X-UR-Request-Buffering off;
                proxy_read_timeout 60s;
                proxy_send_timeout 60s;
                proxy_request_buffering off;
                proxy_buffering off;
            }
        }
    }
}

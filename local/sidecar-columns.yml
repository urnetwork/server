# §22.7's schema guard, server's half (TEST-M1-03; I-18, R-TEST-3): every column the sidecar migration
# groups create, or add to a table that exists today, mapped to the row of §2.8's list it shows under.
# sidecar_schema_guard_test.go applies the groups to a scratch database, reads information_schema.columns
# for these tables, and fails on a column with no row here, a row that is not live or does not store the
# table or column, and a mapped column that no longer exists; under -tags sidecar_pending it also reads
# the groups' SQL, so a table or added column missing here fails before anything reads it.
#
# tables      by name.
#   group     MG0 to MG9, the group that creates the table or adds its columns (§19.7).
#   existing  the table exists before the sidecar: only the columns listed are the sidecar's.
#   columns   each column, and its row of §2.8's list; for a column added to an existing table that the
#             row names in words rather than by name, the row and then those words, which its store or
#             sees must hold.
#
# A row changes only through the design (design-records); a new column needs its row there first, then
# its line here (the brief's metadata rule).


networks:
  filecluster:
    name: sidecar-test-filecluster
    # every host at a fixed address: a host a test stops and starts comes back where the others dial it, as a
    # production host does, where with addresses handed out at start two hosts restarted together swap theirs and
    # the hosts still up keep dialing the old ones, losing the set's write quorum for good
    ipam:
      config:
        - subnet: 172.30.52.0/24


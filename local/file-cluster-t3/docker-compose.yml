# T3's file clusters (§22.4, §22.9; EVSB-M2-17, FS-114, FS-40, FS-63): production's shapes on loopback above port
# 50000, every host its own container of the minio fork's settle_testhooks build (t3.sh builds the image), each with
# its barrier control port published, and one fake chrony they all take time from.
#
#   meta-1   4 hosts x 2 drives at EC:4, the first metadata cluster
#   seg-1    4 hosts x 4 drives at EC:8, the segment cluster
#   meta-2   one 8-drive process at EC:4, a second metadata cluster (FS-63's next cluster)
#
# Containers are named sidecar-test-fc-*, and t3.sh down stops and removes them and their drives. The root user is
# synthetic and reaches nothing but these containers. Drives are named volumes, so a host the suite kills comes back
# with its drives, as a host that lost power does. MINIO_DRIVE_MAX_TIMEOUT is scaled to seconds unless
# FILECLUSTER_T3_DRIVE_TIMEOUT sets production's 30s, as the nightly and Gn-out runs do; hosts.yml's drive_timeout
# must match it.

name: sidecar-test-filecluster-t3

x-host: &host
  image: ${FILECLUSTER_T3_IMAGE:-sidecar-test-fc-minio:local}
  restart: "no"
  networks: [filecluster]
  # the volumes' roots are root's; this is a test image on loopback only
  user: "0:0"
  depends_on: [ntp]

x-settle-env: &settle-env
  MINIO_ROOT_USER: sidecar-t3-filecluster
  MINIO_ROOT_PASSWORD: sidecar-t3-filecluster-only
  MINIO_CI_CD: "1"
  MINIO_DRIVE_MAX_TIMEOUT: ${FILECLUSTER_T3_DRIVE_TIMEOUT:-5s}
  MINIO_SCANNER_SPEED: slowest
  MINIO_PROMETHEUS_AUTH_TYPE: public
  MINIO_BROWSER: "off"
  MINIO_SETTLE_CHRONY_ADDRESS: fc-ntp:123
  _MINIO_SETTLE_TESTHOOK_ADDRESS: 0.0.0.0:9100
  # a loaded test machine's NTP samples, as settlecluster's clockSlack reads them
  _MINIO_SETTLE_CLOCK_MAX_OFFSET: 1s
  _MINIO_SETTLE_LOCK_REFRESH_INTERVAL: 500ms
  _MINIO_SETTLE_LOCK_REFRESH_MISS_AFTER: 2s
  _MINIO_SETTLE_COMMIT_DEADLINE: 4s
  _MINIO_SETTLE_PROBE_INTERVAL_MAX: 200ms
  _MINIO_LOCK_RETRY_INTERVAL: "20"

services:
  ntp:
    image: ${FILECLUSTER_T3_IMAGE:-sidecar-test-fc-minio:local}
    container_name: sidecar-test-fc-ntp
    networks:
      filecluster:
        ipv4_address: 172.30.52.2
    hostname: fc-ntp
    restart: "no"
    entrypoint: ["/t3tool", "ntp", "-listen", ":123"]
  fc-meta-1-host1:
    <<: *host
    container_name: sidecar-test-fc-meta-1-host1
    networks:
      filecluster:
        ipv4_address: 172.30.52.11
    hostname: fc-meta-1-host1
    command: [server, "--address", ":9000", "http://fc-meta-1-host{1...4}:9000/drives/d{1...2}"]
    environment:
      <<: *settle-env
      MINIO_STORAGE_CLASS_STANDARD: "EC:4"
      MINIO_ERASURE_SET_DRIVE_COUNT: "8"
    ports: ["127.0.0.1:52101:9000", "127.0.0.1:52111:9100"]
    volumes:
      - sidecar-test-fc-meta-1-host1-d1:/drives/d1
      - sidecar-test-fc-meta-1-host1-d2:/drives/d2
  fc-meta-1-host2:
    <<: *host
    container_name: sidecar-test-fc-meta-1-host2
    networks:
      filecluster:
        ipv4_address: 172.30.52.12
    hostname: fc-meta-1-host2
    command: [server, "--address", ":9000", "http://fc-meta-1-host{1...4}:9000/drives/d{1...2}"]
    environment:
      <<: *settle-env
      MINIO_STORAGE_CLASS_STANDARD: "EC:4"
      MINIO_ERASURE_SET_DRIVE_COUNT: "8"
    ports: ["127.0.0.1:52102:9000", "127.0.0.1:52112:9100"]
    volumes:
      - sidecar-test-fc-meta-1-host2-d1:/drives/d1
      - sidecar-test-fc-meta-1-host2-d2:/drives/d2
  fc-meta-1-host3:

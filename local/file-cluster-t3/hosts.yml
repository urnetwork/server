# What filecluster-suite needs beyond clusters.yml on T3 (server.FileClusterSuiteHostsFile): each cluster's drives per
# host, the drive timeout the compose file starts it with (FILECLUSTER_T3_DRIVE_TIMEOUT, 5s unless set), and each
# host's barrier control port and container, in clusters.yml's endpoint order. t3.sh suite rewrites drive_timeout from
# the variable, so the two never disagree.
clusters:
  meta-1:
    drives_per_host: 2
    drive_timeout: 5s
    hooks: [127.0.0.1:52111, 127.0.0.1:52112, 127.0.0.1:52113, 127.0.0.1:52114]
    containers: [sidecar-test-fc-meta-1-host1, sidecar-test-fc-meta-1-host2, sidecar-test-fc-meta-1-host3, sidecar-test-fc-meta-1-host4]
  meta-2:
    drives_per_host: 8
    drive_timeout: 5s
    hooks: [127.0.0.1:52311]
    containers: [sidecar-test-fc-meta-2]
  seg-1:
    drives_per_host: 4
    drive_timeout: 5s
    hooks: [127.0.0.1:52211, 127.0.0.1:52212, 127.0.0.1:52213, 127.0.0.1:52214]
    containers: [sidecar-test-fc-seg-1-host1, sidecar-test-fc-seg-1-host2, sidecar-test-fc-seg-1-host3, sidecar-test-fc-seg-1-host4]

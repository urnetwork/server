# The source lock for the canonical service build: the Go release and the
# complete commit of each sibling checkout beside server, under these directory
# names. Local replacements use these sibling directories, so pinning their
# complete source revisions makes one server commit select one reproducible
# graph. Bump the refs together after compiling the service commands. The tests
# in this directory read the refs from here.
go: 1.27.4
siblings:
  # Connect's tracked sctp/ directory supplies the SCTP fork from the same
  # revision.
  - repository: urnetwork/connect
    path: connect
    ref: 69967d8a28f64a867f291f1bdd6c77bd186cfde4
  # Server and the SDK require this module, and server its nested smtpproof
  # module from the same revision. Build's sidecar gitlink pins this commit too.
  - repository: urnetwork/sidecar
    path: sidecar
    ref: 41f51248cff6390ef526284b392c3472461d6171
  - repository: urnetwork/glog
    path: glog
    ref: af8d9e76bfcfa908e785c3c0789d76c90c78302b
  - repository: urnetwork/sdk
    path: sdk
    ref: d5672254dbaa6b907b03de943c2ac7fa853b8f71
  - repository: urnetwork/proxy
    path: proxy
    ref: 676ef48f285443c9274cc72de90366c843605eb6
  - repository: urnetwork/goidenticons
    path: goidenticons
    ref: 39ccec1b69db3a6f67e7346d6f44863499e6241d
  - repository: urnetwork/userwireguard
    path: userwireguard
    ref: 70ecd6e7f97715718f1079cc9be9fd42a8ebe82c
  - repository: urnetwork/warp
    path: warp
    ref: 809ec81870bf82537f00cda6589ba0b8ba2b361b
  - repository: urfoundation/sn
    path: sn
    ref: c35886634c472a4788d3fc3aa97a17fb93d0fc51
  # Server and SN's fixture generator use this same reviewed fork. Published
  # release modules receive an immutable replacement from the builder.
  - repository: urnetwork/gvisor
    path: gvisor
    ref: e21e4a40b9c9a5a111f05e2334fabc83c5f2a82a

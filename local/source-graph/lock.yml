# The source lock for the canonical service build: the Go release and the
# complete commit of each sibling checkout beside server, under these directory
# names. Local replacements use these sibling directories, so pinning their
# complete source revisions makes one server commit select one reproducible
# graph. Bump the refs together after compiling the service commands. The tests
# in this directory read the refs from here.
go: 1.27.3
siblings:
  # Connect's tracked sctp/ directory supplies the SCTP fork from the same
  # revision.
  - repository: urnetwork/connect
    path: connect
    ref: f1837db6df365cc24ecbd9fa6f0bf7c40cd9ea11
  - repository: urnetwork/glog
    path: glog
    ref: c9292862af39bbc73aeeddb38981059841ea84fe
  - repository: urnetwork/sdk
    path: sdk
    ref: 23b3c7dd18fc16be13e8782501d6fb4cffe92aa7
  - repository: urnetwork/proxy
    path: proxy
    ref: 69824fd10f202c88e6fccfff5cadff37b3a274eb
  - repository: urnetwork/goidenticons
    path: goidenticons
    ref: 39ccec1b69db3a6f67e7346d6f44863499e6241d
  - repository: urnetwork/userwireguard
    path: userwireguard
    ref: f9a92f0e5f5577a80d358065c4d39ca21f971a1c
  - repository: urnetwork/warp
    path: warp
    ref: 142b48b4553e819537a17b108ce3824d0547857e
  - repository: urfoundation/sn
    path: sn
    ref: 83e6f48c2541001850cf2b10a96a45654a85e431
